<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <title>Frontend Mentor | QR code component</title>
</head>
<body>
  <main class="quar-card">
    <img src="images/image-qr-code.png" alt="QR code component" class="quar-card__image">
    <h1 class="quar-card__title">Improve your front-end skills by building projects</h1>
    <p class="quar-card__text">Scan the QR code to visit Frontend Mentor and take yout coding skills to the next level</p>
  </main>
</body>
</html>
